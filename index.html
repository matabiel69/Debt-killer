<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Payments</title>
<style>
  :root{
    --ink:#14150f;--paper:#f4f1e8;--card:#fbf9f2;--line:#ded8c7;
    --green:#3a5a40;--gold:#b0842a;--muted:#7c786c;--check:#3a5a40;--copper:#c9772f;--red:#a3402f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;}
  body{max-width:480px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 30px);min-height:100vh;}
  header{padding:24px 2px 14px;}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  h1{font-family:"SF Pro Display",-apple-system,sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:3px;}
  .cycle{border:1px solid var(--line);border-radius:16px;margin-bottom:14px;background:var(--card);overflow:hidden;}
  .cycle.here{border:1.5px solid var(--copper);}
  .chead{padding:16px 18px;display:flex;align-items:center;gap:12px;}
  .cnum{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .cdate{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-top:2px;}
  .here-tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--copper);padding:3px 8px;border-radius:99px;}
  .cleft{margin-left:auto;text-align:right;}
  .cleft .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .cleft .amt{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--green);}
  .cleft .amt.neg{color:var(--red);}
  .chev{color:var(--muted);font-size:14px;margin-left:4px;transition:transform .2s;}
  .cycle.open .chev{transform:rotate(90deg);}
  .cbody{display:none;padding:0 18px 8px;}
  .cycle.open .cbody{display:block;}
  .grp{margin-top:6px;}
  .grp-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 0 4px;border-top:1px solid var(--line);}
  .line{display:flex;align-items:center;gap:11px;padding:10px 0;}
  .day{font-size:12px;font-weight:700;color:var(--muted);width:42px;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .line .nm{flex:1;font-size:15px;font-weight:600;}
  .line .vl{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .vl.in{color:var(--green);}
  .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;}
  .box.on{background:var(--check);border-color:var(--check);}
  .box.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);}
  .line.paid .nm{text-decoration:line-through;color:var(--muted);}
  .line.paid .vl{color:var(--muted);}
  .csum{display:flex;justify-content:space-between;padding:13px 0 6px;border-top:1.5px solid var(--ink);margin-top:6px;font-size:13px;}
  .csum .k{color:var(--muted);font-weight:600;}
  .csum .v{font-weight:700;font-variant-numeric:tabular-nums;}
  .paidrun{font-size:12px;color:var(--green);font-weight:600;padding-bottom:8px;}
  .reset{width:100%;background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;margin-top:18px;padding:10px;text-decoration:underline;}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5;padding:0 10px;}
  .eduin{width:78px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green);background:#fff;text-align:right;font-family:inherit;}
  .paydivider{display:flex;align-items:center;gap:8px;margin:12px 0 4px;}
  .pdline{flex:1;height:1px;background:var(--copper);opacity:.4;}
  .pdlabel{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--copper);white-space:nowrap;}
  .pdsub{font-size:11px;color:var(--muted);font-weight:600;padding:0 0 4px;}
  .whatif{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .wi-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .wi-row{display:flex;align-items:center;gap:6px;}
  .wi-dollar{font-size:20px;font-weight:800;color:var(--ink);}
  .wi-in{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;background:#fff;font-family:inherit;color:var(--ink);}
  .wi-out{margin-top:10px;font-size:15px;font-weight:700;}
  .wi-out.ok{color:var(--green);}
  .wi-out.no{color:var(--red);}
  .carryrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;}
  .carry-lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .carry-in-wrap{font-size:16px;font-weight:800;color:var(--ink);}
  .carry-in{width:80px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-family:inherit;color:var(--ink);background:#fff;}
  .runbal{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:12px 14px;background:var(--green);border-radius:12px;}
  .runbal .rb-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#e9f0e9;font-weight:700;}
  .runbal .rb-v{font-size:24px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
  .runbal .rb-v.neg{color:#ffd9d3;}
  .rb-note{font-size:11px;color:var(--muted);margin-top:6px;text-align:center;}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Recurring payments</div>
  <h1>Monthly</h1>
</header>
<div id="cycles"></div>
<button class="reset" onclick="resetAll()">Uncheck everything</button>
<div class="note">Tap a cycle to open it. Check payments off as you make them. Leftover updates live. Saved on this device.</div>

<script>
// Cycles run monthly, starting on the 1st when VA money lands.
// Start from the 1st of the current month.
function firstOfThisMonth(){
  const now=new Date();
  return new Date(now.getFullYear(), now.getMonth(), 1);
}
const ANCHOR=firstOfThisMonth();
const CYCLES=6;
const CDL=2240;                 // per paycheck (avg)
const VA_DISABILITY=4298;       // 1st of month, fixed
let VA_EDUCATION=935;           // 1st of month, VARIES — editable in the app

// Monthly recurring payments only. name, amount, day-of-month
const BILLS=[
  // Housing + fixed
  {name:"Bilt rent",amt:2086.55,day:2},
  {name:"Hyundai lease",amt:955.84,day:4},
  {name:"Roadrunner",amt:200,day:2},
  {name:"Upstart (Michela)",amt:409.95,day:1},
  {name:"Upstart (Mpli)",amt:106.61,day:28},
  {name:"Upstart (Fu)",amt:41.21,day:1},
  {name:"T-Mobile",amt:255,day:16},
  {name:"Yamaha",amt:410,day:17},
  {name:"USAA auto insurance",amt:500,day:18},
  {name:"Comcast / Xfinity",amt:136.23,day:29},
  {name:"Lemonade renters",amt:76.25,day:30},
  // Credit cards (amount = what you actually pay)
  {name:"Amex",amt:116,day:21},
  {name:"Citi / Costco",amt:174,day:28},
  {name:"Chase Prime Visa",amt:200,day:2},
  // Affirm plans, individually, with real due dates
  {name:"Affirm 1",amt:134.42,day:3},
  {name:"Affirm 2",amt:86.68,day:13},
  {name:"Affirm 3",amt:51.16,day:3},
  {name:"Affirm 4",amt:50.53,day:3},
  {name:"Affirm 5",amt:45.53,day:3},
  {name:"Affirm 6",amt:45.02,day:3},
  {name:"Affirm 7",amt:43.78,day:13},
  {name:"Affirm 8",amt:43.41,day:13},
  {name:"Affirm 9",amt:28.28,day:3}
];

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const money=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const fmt=d=>MON[d.getMonth()]+" "+d.getDate();
const ord=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
const key=d=>d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();

const store={
  async get(k){ if(window.storage&&window.storage.get)return window.storage.get(k); const v=localStorage.getItem(k); return v!=null?{value:v}:null; },
  async set(k,v){ if(window.storage&&window.storage.set)return window.storage.set(k,v); localStorage.setItem(k,v); return {value:v}; }
};

let paid={};
let eduAmt=VA_EDUCATION;
let carry={};   // per-month carryover from last month, keyed by "YYYY-M"
async function load(){
  try{const r=await store.get("biweekly_v6");if(r&&r.value){const d=JSON.parse(r.value);paid=d.paid||{};if(d.eduAmt!=null)eduAmt=d.eduAmt;carry=d.carry||{};}}catch(e){}
  build();
}
async function persist(){try{await store.set("biweekly_v6",JSON.stringify({paid,eduAmt,carry}));}catch(e){}}

// biweekly CDL paydays (Fridays), reference Aug 21 2026
const CDL_REF=new Date(2026,7,21);
function cdlPaydaysIn(start,end){
  const out=[];
  const ref=new Date(CDL_REF);ref.setHours(0,0,0,0);
  // walk back to first payday <= start
  let d=new Date(ref);
  const back=Math.ceil((ref-start)/(14*86400000));
  d.setDate(ref.getDate()-back*14);
  while(d<start){d.setDate(d.getDate()+14);}
  while(d<=end){ out.push(new Date(d)); d.setDate(d.getDate()+14); }
  return out;
}

function build(){
  const now=new Date();now.setHours(0,0,0,0);
  const wrap=document.getElementById("cycles");
  wrap.innerHTML="";
  for(let c=0;c<CYCLES;c++){
    // monthly cycle: 1st of month -> last day of month
    const start=new Date(ANCHOR.getFullYear(), ANCHOR.getMonth()+c, 1);
    const end=new Date(ANCHOR.getFullYear(), ANCHOR.getMonth()+c+1, 0);
    const isHere=(now>=start&&now<=end);

    const income=[];
    // VA on the 1st, two separate lines
    income.push({name:"VA disability",amt:VA_DISABILITY,date:new Date(start),kind:"va"});
    income.push({name:"VA education",amt:eduAmt,date:new Date(start),kind:"edu"});
    // CDL paychecks that fall in this month
    cdlPaydaysIn(start,end).forEach(d=>income.push({name:"CDL paycheck",amt:CDL,date:d,kind:"cdl"}));

    const bills=[];
    BILLS.forEach(b=>{
      const dd=new Date(start.getFullYear(), start.getMonth(), b.day);
      if(dd>=start&&dd<=end&&b.amt>0)bills.push({name:b.name,amt:b.amt,date:dd});
    });
    // Dog daycare: $34 x 3 = $102 per week. One charge per week (dated Monday) in this month.
    {
      const d=new Date(start);
      // move to first Monday on/after the 1st
      while(d.getDay()!==1) d.setDate(d.getDate()+1);
      let wk=1;
      while(d<=end){
        bills.push({name:"Dog daycare (week "+wk+")",amt:102,date:new Date(d)});
        d.setDate(d.getDate()+7); wk++;
      }
    }
    income.sort((a,b)=>a.date-b.date);
    bills.sort((a,b)=>a.date-b.date);

    const inTot=income.reduce((s,x)=>s+x.amt,0);
    const outTot=bills.reduce((s,x)=>s+x.amt,0);
    const paidTot=bills.filter(x=>paid[key(x.date)+"|"+x.name]).reduce((s,x)=>s+x.amt,0);
    const mkey=start.getFullYear()+"-"+start.getMonth();
    const carryAmt=parseFloat(carry[mkey])||0;
    // running balance: what you have right now = carryover + income - payments already checked off
    const running=carryAmt+inTot-paidTot;
    // projected leftover once everything is paid
    const left=carryAmt+inTot-outTot;

    const el=document.createElement("div");
    el.className="cycle"+(isHere?" here open":"");
    el.innerHTML=`
      <div class="chead" onclick="this.parentNode.classList.toggle('open')">
        <div>
          <div class="cnum">Month</div>
          <div class="cdate">${MON[start.getMonth()]} ${start.getFullYear()}</div>
        </div>
        ${isHere?'<span class="here-tag">You are here</span>':''}
        <div class="cleft"><div class="lbl">Money left now</div><div class="amt ${running<0?'neg':''}">${money(running)}</div></div>
        <span class="chev">▶</span>
      </div>
      <div class="cbody">
        <div class="carryrow">
          <span class="carry-lbl">Left over from last month</span>
          <span class="carry-in-wrap">$<input class="carry-in" type="number" inputmode="decimal" placeholder="0" value="${carry[mkey]!=null?carry[mkey]:''}" data-mkey="${mkey}" onchange="setCarry(this)" /></span>
        </div>
        <div class="grp">
          <div class="grp-h">Money in</div>
          ${income.map(x=>{
            if(x.kind==="edu"){
              return `<div class="line"><span class="day">${ord(x.date.getDate())}</span><span class="nm">VA education <span style="color:var(--muted);font-weight:500">(editable)</span></span><span class="vl in">+$<input class="eduin" type="number" inputmode="decimal" value="${eduAmt}" onchange="setEdu(this.value)" /></span></div>`;
            }
            return `<div class="line"><span class="day">${ord(x.date.getDate())}</span><span class="nm">${x.name}</span><span class="vl in">+${money(x.amt)}</span></div>`;
          }).join("")}
        </div>
        <div class="grp">
          <div class="grp-h">Payments due</div>
          ${(()=>{
            const cdls=income.filter(x=>x.kind==="cdl").sort((a,b)=>a.date-b.date);
            const secondCdl=cdls.length>=2?cdls[1].date:null;
            const rowHtml=x=>{const k=key(x.date)+"|"+x.name;return `<div class="line ${paid[k]?'paid':''}"><span class="day">${ord(x.date.getDate())}</span><span class="box ${paid[k]?'on':''}" onclick="toggle('${k}')"></span><span class="nm" onclick="toggle('${k}')">${x.name}</span><span class="vl">${money(x.amt)}</span></div>`;};
            if(!bills.length) return '<div class="line"><span class="nm" style="color:var(--muted)">No payments this window</span></div>';
            if(!secondCdl) return bills.map(rowHtml).join("");
            const before=bills.filter(x=>x.date<secondCdl);
            const after=bills.filter(x=>x.date>=secondCdl);
            const afterTot=after.reduce((s,x)=>s+x.amt,0);
            let h=before.map(rowHtml).join("");
            h+=`<div class="paydivider"><span class="pdline"></span><span class="pdlabel">2nd CDL check hits ${MON[secondCdl.getMonth()]} ${secondCdl.getDate()} · +${money(CDL)}</span><span class="pdline"></span></div>`;
            h+=`<div class="pdsub">These come out of the 2nd check — ${money(afterTot)}</div>`;
            h+=after.map(rowHtml).join("");
            return h;
          })()}
        </div>
        <div class="csum"><span class="k">Carryover + income</span><span class="v">${money(carryAmt+inTot)}</span></div>
        <div class="csum" style="border:none;padding-top:4px"><span class="k">Payments (total)</span><span class="v">${money(outTot)}</span></div>
        ${paidTot>0?`<div class="paidrun">${money(paidTot)} paid so far · ${money(outTot-paidTot)} still to pay</div>`:''}
        <div class="runbal">
          <span class="rb-k">Money left right now</span>
          <span class="rb-v ${running<0?'neg':''}">${money(running)}</span>
        </div>
        <div class="rb-note">Drops as you check off each payment. Once all are paid: ${money(left)} left.</div>
        <div class="whatif">
          <div class="wi-h">What if I spend&hellip;</div>
          <div class="wi-row">
            <span class="wi-dollar">$</span>
            <input class="wi-in" type="number" inputmode="decimal" placeholder="1000" data-left="${left}" oninput="whatIf(this)" />
          </div>
          <div class="wi-out"></div>
        </div>
      </div>`;
    wrap.appendChild(el);
  }
}
function toggle(k){paid[k]=!paid[k];persist();
  const opens=[...document.querySelectorAll('.cycle')].map(c=>c.classList.contains('open'));
  build();
  document.querySelectorAll('.cycle').forEach((c,i)=>{if(opens[i])c.classList.add('open');else c.classList.remove('open');});
}
function setEdu(v){eduAmt=parseFloat(v)||0;persist();
  const opens=[...document.querySelectorAll('.cycle')].map(c=>c.classList.contains('open'));
  build();
  document.querySelectorAll('.cycle').forEach((c,i)=>{if(opens[i])c.classList.add('open');else c.classList.remove('open');});
}
function whatIf(el){
  const left=parseFloat(el.getAttribute("data-left"))||0;
  const spend=parseFloat(el.value);
  const out=el.parentNode.parentNode.querySelector(".wi-out");
  if(!(spend>0)){out.textContent="";out.className="wi-out";return;}
  const after=left-spend;
  const m=n=>"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
  if(after>=0){
    out.className="wi-out ok";
    out.textContent="Yes — you'd have "+m(after)+" left this month.";
  }else{
    out.className="wi-out no";
    out.textContent="No — you'd be "+m(after)+" short this month.";
  }
}
function setCarry(el){const mk=el.getAttribute("data-mkey");const v=el.value.trim();if(v==="")delete carry[mk];else carry[mk]=parseFloat(v)||0;persist();
  const opens=[...document.querySelectorAll('.cycle')].map(c=>c.classList.contains('open'));
  build();
  document.querySelectorAll('.cycle').forEach((c,i)=>{if(opens[i])c.classList.add('open');else c.classList.remove('open');});
}
function resetAll(){paid={};persist();build();}
load();
</script>
</body>
</html>
